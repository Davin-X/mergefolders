name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell tests
        run: bash tests/test_mergefolders.sh
      - name: Build and verify the Finder app
        run: |
          bash finder/build.sh --build-only
          app=finder/build/MergeFolders.app
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/mergefolders" --help
          "$app/Contents/Resources/mergefolders" --version
          lipo -archs "$app/Contents/MacOS/MergeFolders" | grep -q 'x86_64 arm64'
          nm -u "$app/Contents/PlugIns/MergeFoldersExt.appex/Contents/MacOS/MergeFoldersExt" | grep _NSExtensionMain
